<!DOCTYPE html>
<html lang = "ja">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width= device-width, initial-scale=1.0">
    <title>タスク管理アプリ</title>
    <link rel="stylesheet" href="styles.css">    
</head>
<body>
    <div id="board-scene">
        <!-- 一番大きい見出し -->
        <div class="head">
            <h1>タスク管理アプリ</h1>
    </div>
    <div class="kanban-board">
        <!-- タスクの分類 -->
        <section class="column">
            <h2>未着手</h2>
            <div class="task-list">
                <div class="task-card status-todo">タスク１</div>
                <div class="task-card status-todo">タスク２</div>
                <div class="task-card status-todo">タスク３</div>
            </div>
        </section>
        <section class="column">
            <h2>着手中</h2>
            <div class="task-list">
                <div class="task-card status-doing">タスク１</div>
                <div class="task-card status-doing">タスク２</div>
                <div class="task-card status-doing">タスク３</div>
            </div>
        </section>
        <section class="column">
            <h2>完了済み</h2>
            <div class="task-list">
                <div class="task-card status-done">タスク１</div>
                <div class="task-card status-done">タスク２</div>
                <div class="task-card status-done">タスク３</div>
            </div>
        </section>
    </div>
    <!-- 追加ボタン -->
    <button id="show-form-btn" class="add-button">+</button>
    </div>

    <div id="form-scene" style="display: none;">
        <h2>タスクを追加</h2>
        <label for="task-input">内容：</label>
        <input type="text" id="task-input" required placeholder="何をしますか？">
        <button id="save-btn">保存</button>
        <button id="cancel-btn">戻る</button>
    </div>
<script src="script.js"></script>
</body>
</html>
